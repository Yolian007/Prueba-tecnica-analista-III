<section class="seccion-resumen">
  <h2>Resumen de conciliación</h2>
  <div class="cuadricula-resumen">
    <div class="tarjeta-resumen total">
      <div class="etiqueta-resumen">Total facturas</div>
      <div class="numero-resumen">{{ resumen.total_facturas }}</div>
      <div class="porcentaje-resumen">Registros analizados</div>
    </div>
    <div class="tarjeta-resumen correctas">
      <div class="etiqueta-resumen">Correctas</div>
      <div class="numero-resumen">{{ resumen.correctas }}</div>
      <div class="porcentaje-resumen">{{ porcentaje(resumen.correctas) }} del total</div>
      <div class="barra" aria-hidden="true"><span [style.width]="porcentaje(resumen.correctas)"></span></div>
    </div>
    <div class="tarjeta-resumen inconsistencias">
      <div class="etiqueta-resumen">Con inconsistencias</div>
      <div class="numero-resumen">{{ resumen.con_inconsistencia }}</div>
      <div class="porcentaje-resumen">{{ porcentaje(resumen.con_inconsistencia) }} del total</div>
      <div class="barra" aria-hidden="true"><span [style.width]="porcentaje(resumen.con_inconsistencia)"></span></div>
    </div>
  </div>
</section>
