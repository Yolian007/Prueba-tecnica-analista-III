<div class="contenedor-principal">
  <header class="cabecera-principal">
    <div class="contenido-cabecera">
      <div class="marca-icono" aria-hidden="true">
        <svg class="icono" viewBox="0 0 24 24">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1"/>
          <polyline points="9 14 11 16 15 12"/>
        </svg>
      </div>
      <div class="texto-cabecera">
        <p class="sobretitulo">Gerencia de Evolución Contable y Tributaria</p>
        <h1>Conciliador de Facturas y Retenciones</h1>
        <p class="subtitulo">Cruce automático entre facturas de proveedores y registros contables</p>
      </div>
    </div>
  </header>

  <main class="contenido-principal">
    <app-carga-archivos
      [cargando]="cargando"
      [mensajeError]="mensajeError"
      (archivosCambiados)="limpiarResultados()"
      (procesar)="procesar($event)" />

    @if (resultados) {
      <app-resumen-conciliacion [resumen]="resultados.resumen" />
      <app-tabla-resultados [resultados]="resultados.resultados" />
    }
  </main>

  <footer class="pie-principal">
    <p>Prototipo · Conciliador de Facturas y Retenciones · Prueba Técnica Analista III</p>
  </footer>
</div>
